<h2>
     GENERAL
    </h2>
<p>
     Al realizar cualquier compra o solicitar una comisión a SkyNatt, confirmas que has leído y aceptado estos Términos de Servicio en su totalidad. SkyNatt se reserva el derecho de rechazar cualquier solicitud por cualquier motivo. Estos términos pueden actualizarse en cualquier momento; es responsabilidad del cliente revisarlos antes de cada nueva compra o encargo.
    </p>
<p>
<strong>
      Tipos de producto:
     </strong>
<br/>
     — Comisiones custom (VGen): emotes chibi personalizados
     <br/>
     — Tienda fija (VGen + Etsy): badges de stream, widgets/overlays, plantillas de stream, agendas digitales, plantillas Notion y GoodNotes.
    </p>
<p>
<strong>
      Acepto:
     </strong>
     Chibi/emotes expresivos, OC/personaje propio, Humano(ide), Fanart, Anthro/furry, VTuber/avatar.
     <br/>
<strong>
      No acepto:
     </strong>
     Realismo, Mecha/robots, Gore explícito, NSFW, arte de otros artistas, entrenamiento de IA.
    </p>
<p>
     🌸
     <strong>
      Tarjeta de fidelidad:
     </strong>
     Los clientes recurrentes reciben un sello por cada comisión completada. Los sellos pueden desbloquear recompensas como descuentos y arte gratuito según las campañas activas.
    </p>
<h2>
     PAGOS
    </h2>
<p>
     Todos los pagos se realizan a través de la plataforma correspondiente (VGen o Etsy). Los precios son finales y no negociables.
    </p>
<p>
<strong>
      Comisiones custom (VGen):
     </strong>
     1 emote → 10€ | Pack 3 → 28€ | Pack 5 → 45€ | Pack 10 → 85€. Cada emote incluye línea limpia, color completo y shading. Se entrega en PNG con fondo transparente y versión optimizada para Twitch/Discord.
    </p>
<p>
     Para comisiones custom superiores a 50€, se ofrece un plan de pago cuando sea aplicable: 50% al inicio y 50% al aprobar el WIP.
    </p>
<h2>
     REVISIONES
    </h2>
<p>
     Solo aplica a comisiones custom. Los productos de tienda fija no incluyen revisiones al ser productos prediseñados. Cada emote incluye 2 revisiones menores durante el boceto. Cambios adicionales: revisión menor +5€ / revisión compleja +15€ o más. Si no se recibe feedback en 48 horas tras compartir un WIP, se considerará aprobado. Los cambios solicitados después de aprobar el boceto pueden conllevar coste adicional.
    </p>
<h2>
     PLAZOS Y ENTREGA
    </h2>
<p>
<strong>
      Comisiones custom:
     </strong>
     plazo estándar de 1–2 semanas por emote. Para packs, el plazo varía según cantidad y cola. Entrega urgente: 3–4 días +200% / 5–7 días +120% / prioridad en cola +100%.
    </p>
<p>
     Entregables: PNG en alta resolución + versión optimizada Twitch/Discord (112×112 px). PSD disponible con coste adicional. Envío por VGen o Google Drive.
    </p>
<p>
<strong>
      Tienda fija:
     </strong>
     descarga inmediata tras la compra en VGen y Etsy. Cada producto incluye guía de uso.
    </p>
<h2>
     USO Y LICENCIAS
    </h2>
<p>
<strong>
      Uso personal (incluido):
     </strong>
     foto de perfil, banner, streaming no monetizado, uso educativo personal e impresión propia. Crédito a @SkyNattArts recomendado.
    </p>
<p>
<strong>
      Uso comercial — Contenido (+100%):
     </strong>
     contenido monetizado donde el producto sea el elemento principal. Requiere licencia y crédito obligatorio.
    </p>
<p>
<strong>
      Uso comercial — Merchandising (+200%):
     </strong>
     productos físicos o digitales para venta. Requiere licencia y crédito obligatorio.
    </p>
<p>
<strong>
      Prohibido:
     </strong>
     entrenar IA, revender sin licencia, eliminar firma o asociar los productos a NFTs.
    </p>

    </h2>
<p>
     SkyNatt conserva la autoría y derechos de autor sobre todos los productos y puede mostrar el trabajo en su portfolio y redes. NDA disponible con coste adicional.
    </p>
<p>

    </p>
<h2>
     REEMBOLSOS
    </h2>
<p>
<strong>
      Comisiones custom:
     </strong>
     reembolso 100% solo si no se ha iniciado el boceto. Una vez iniciado el trabajo, no hay reembolsos salvo que la legislación aplicable disponga lo contrario. Los chargebacks injustificados podrán ser disputados mediante la plataforma correspondiente.
    </p>
<p>
<strong>
      Tienda fija:
     </strong>
     no hay reembolsos tras la descarga salvo cuando la normativa aplicable obligue a ello. Si el archivo está dañado o es incorrecto, se enviará un reemplazo gratuito. En Etsy puede aplicar la política de la plataforma.
    </p>
<h2>
     COMUNICACIÓN
    </h2>
<p>
     Las comunicaciones deben ser claras y respetuosas. No se aceptan solicitudes de avances cada pocas horas ni cambios basados únicamente en opiniones de terceros. Conductas tóxicas o abusivas pueden provocar la cancelación del servicio conforme a la situación y la normativa aplicable.
    </p>
<p>
     Sin respuesta durante 30 días → proyecto pausado. Sin respuesta durante 45 días → cancelación sin reembolso cuando corresponda. Dudas sobre tienda fija: objetivo de respuesta de 48–72 horas.
    </p>
